<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Piko" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      :root {
        color-scheme: light dark;
        --piko-page-background: Canvas;
        --piko-scrollbar-thumb: GrayText;
        --piko-scrollbar-thumb-hover: GrayText;
      }
      html,
      body {
        height: 100%;
        background: var(--piko-page-background);
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="piko-preview-scrollbar">
      [data-testid="artifact-preview-scroll"] {
        scrollbar-width: thin;
        scrollbar-color: var(--piko-scrollbar-thumb) transparent;
        scrollbar-gutter: stable;
      }
      [data-testid="artifact-preview-scroll"]::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      [data-testid="artifact-preview-scroll"]::-webkit-scrollbar-track {
        background: transparent;
      }
      [data-testid="artifact-preview-scroll"]::-webkit-scrollbar-thumb {
        background-color: var(--piko-scrollbar-thumb);
        border: 2px solid transparent;
        border-radius: 8px;
        background-clip: content-box;
      }
      [data-testid="artifact-preview-scroll"]::-webkit-scrollbar-thumb:hover {
        background-color: var(--piko-scrollbar-thumb-hover);
      }
    </style>
  </head>

  <body>
    <noscript>需要启用 JavaScript 才能运行 Piko。</noscript>
    <div id="root"></div>
  </body>
</html>
